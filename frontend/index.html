<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Modo Prelanzamiento — estático a propósito: esta es una SPA de Vite
         sin renderizado por request, así que no puede seguir en vivo al
         flag publicLaunchEnabled de la base (eso requeriría SSR/una función
         edge, infraestructura nueva que esta ronda no construye). Se
         retira a mano como parte del mismo deploy del lanzamiento público
         real — ver también /public/robots.txt y el aviso en Developer >
         Configuración. -->
    <meta name="robots" content="noindex, nofollow" />
    <title>PaseCultural</title>
    <!-- Apariencia claro/oscuro CONTEXTUAL (ver ThemeContext.jsx) — aplica la
         clase ANTES de que React monte, para evitar el flash de un modo
         incorrecto al recargar. NO hay preferencia manual del usuario acá:
         esto sólo cubre los dos casos que se pueden resolver de forma
         síncrona, sin esperar a que Clerk resuelva el rol (eso lo termina
         de decidir ThemeContext ya con React montado):
           1) URL directa a /organizacion/:slug → claro, siempre.
           2) sessionStorage ya marca una Organization Experience activa
              (ver ORG_EXPERIENCE_STORAGE_KEY) → claro (cubre F5 sobre el
              detalle de un evento o el checkout, dentro de ese recorrido).
         Un Organizer que recarga en una pantalla general puede ver un
         flash oscuro breve hasta que se resuelve su rol — aceptable,
         evita construir una solución de bootstrap más pesada para un caso
         que no se puede saber de forma síncrona sin autenticar antes. -->
    <script>
      (function () {
        try {
          if (location.pathname.indexOf("/organizacion/") === 0) {
            document.documentElement.classList.add("light");
            return;
          }
          if (sessionStorage.getItem("smarticket-organization-experience")) {
            document.documentElement.classList.add("light");
          }
        } catch (err) {
          /* localStorage/sessionStorage inaccesible (modo privado estricto,
             etc.): se queda en el modo oscuro por default, igual que
             siempre. */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
