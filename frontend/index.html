<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Modo Prelanzamiento — estático a propósito: esta es una SPA de Vite
         sin renderizado por request, así que no puede seguir en vivo al
         flag publicLaunchEnabled de la base (eso requeriría SSR/una función
         edge, infraestructura nueva que esta ronda no construye). Se
         retira a mano como parte del mismo deploy del lanzamiento público
         real — ver también /public/robots.txt y el aviso en Developer >
         Configuración. -->
    <meta name="robots" content="noindex, nofollow" />
    <title>PaseCultural</title>
    <!-- Selector universal claro/oscuro — aplica la clase ANTES de que React
         monte, para evitar el flash de un modo incorrecto al recargar.
         Sólo lee localStorage (misma clave que ThemeContext.jsx) y setea
         una clase en <html> — nunca toca red, nunca bloquea el render. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("smarticket-theme");
          if (stored === "light") {
            document.documentElement.classList.add("light");
          }
        } catch (err) {
          /* localStorage inaccesible (modo privado estricto, etc.): se
             queda en el modo oscuro por default, igual que siempre. */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
