# Backend de Smarticket/PaseCultural en Fly.io — región São Paulo (gru).
# El nombre de la app conserva el sufijo "-test" por motivos históricos
# (nació como instancia de prueba en paralelo a un backend anterior en
# Render/Oregon, migrado desde entonces) — hoy es el backend real en uso.
#
# A propósito: UNA sola región (gru), sin autoscaling multi-región.
app = "smarticket-backend-gru-test"
primary_region = "gru"

[build]

[env]
  NODE_ENV = "production"
  PORT = "3000"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/api/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
